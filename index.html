<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Press Start 2P",monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;width:min(100vw,133.33vh);height:min(75vw,100vh);background:#000;display:block}
#menu,#pause{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:16px;text-align:center;overflow:auto}
#menu{background:#000;z-index:10}
#pause{background:rgba(0,0,0,.9);z-index:9;display:none}
#menu h1{font-size:clamp(26px,7vw,54px);margin:4px 0 0;letter-spacing:4px;font-weight:400}
#pause h2{font-size:26px;font-weight:400;margin:0 0 10px;letter-spacing:3px}
.sub{font-size:10px;color:#888;margin:0 0 6px;line-height:1.8}
#menu label{font-size:10px;color:#aaa;margin-top:6px}
#logo{width:192px;height:144px;image-rendering:pixelated}
#nm{font-family:inherit;font-size:14px;background:#000;color:#fff;border:3px solid #fff;padding:10px;width:240px;text-align:center;outline:none;text-transform:uppercase;-webkit-user-select:text;user-select:text}
#nm:focus{border-color:#ffd84a}
.btn{font-family:inherit;font-size:14px;background:#000;color:#fff;border:3px solid #fff;padding:12px 22px;cursor:pointer}
.btn:hover,.btn:focus{background:#fff;color:#000;outline:none}
.btn.small{font-size:9px;border-color:#555;color:#888;padding:8px 12px}
#pause .btn{min-width:min(86vw,360px)}
#au{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;text-align:center;overflow:auto;background:rgba(0,0,0,.96);z-index:11;color:#ddd}
#au h2{color:#e0483b;font-weight:400;letter-spacing:2px;margin:0}#au p{margin:4px 0;max-width:460px}#au b.aucode{font-size:28px;color:#ffd84a;letter-spacing:6px}
#aubody{display:flex;flex-direction:column;align-items:center;gap:8px}#au .row{display:flex;gap:8px;align-items:center}
#aucode{width:90px;text-align:center;text-transform:uppercase;font:inherit;font-size:16px;background:#000;color:#fff;border:2px solid #fff;padding:6px}
.aupl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;text-align:left;font-size:12px}.aupl i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle;border:1px solid #fff}
.aucols{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.aucols .btn{width:24px;height:24px;padding:0;min-width:0}.aucols .sel{outline:3px solid #ffd84a}
#saves{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;text-align:center;overflow:auto;background:rgba(0,0,0,.96);z-index:11}
#saves .sh3{font-size:11px;font-weight:400;margin:10px 0 2px;color:#7fe87f;letter-spacing:1px}
.slot.auto{border-color:#2f6a3a}.slot.auto p{color:#9fd8a8}.slot.gift{border-color:#e0483b}.slot.gift p{color:#ffb0a0}
#saves h2{font-size:22px;font-weight:400;margin:0 0 6px;letter-spacing:3px}
.slot{border:3px solid #555;padding:10px;width:min(90vw,420px);display:flex;flex-direction:column;gap:8px}
.slot p{font-size:9px;color:#aaa;line-height:1.9;margin:0}
.slot .row{display:flex;gap:8px;justify-content:center}
.slot .btn{font-size:10px;padding:9px 12px}
.slot .del{border-color:#a33;color:#f88}.slot .warn{background:#a33;color:#fff}
.slot.fin{border-color:#ffd84a}.slot.fin p{color:#ffd84a}
.help{font-size:8px;color:#666;line-height:2;margin:4px 0 0}
#mbtn{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:6;display:none;background:rgba(0,0,0,.6)}
#chat{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:8;display:none;gap:6px;width:min(92vw,560px)}
#chat input{flex:1;font-family:inherit;font-size:11px;background:#000;color:#fff;border:3px solid #fff;padding:10px;outline:none;min-width:0;-webkit-user-select:text;user-select:text}
#chat button{font-family:inherit;font-size:11px;background:#fff;color:#000;border:3px solid #fff;padding:0 12px}
#touch{display:none;position:fixed;inset:0;z-index:5;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;width:56px;height:56px;border:3px solid #fff;background:rgba(0,0,0,.45);color:#fff;font-family:inherit;font-size:14px;opacity:.6;display:flex;align-items:center;justify-content:center}
#touch .b.dn{background:#fff;color:#000;opacity:.9}
@media (pointer:coarse){#touch{display:block}}
@media (pointer:coarse) and (orientation:portrait){#stage{align-items:flex-start;padding-top:8px}}

<body>
<div id="stage"><canvas id="cv" width="960" height="720"></canvas></div>
<div id="touch">
  <button class="b" data-k="up" style="left:76px;bottom:140px">▲</button>
  <button class="b" data-k="left" style="left:16px;bottom:80px">◀</button>
  <button class="b" data-k="right" style="left:136px;bottom:80px">▶</button>
  <button class="b" data-k="down" style="left:76px;bottom:20px">▼</button>
  <button class="b" data-k="A" style="right:20px;bottom:90px;width:68px;height:68px">A</button>
  <button class="b" data-k="run" style="right:100px;bottom:30px">B</button>
  <button class="b" data-k="T" style="right:20px;bottom:180px;width:68px;height:40px;font-size:9px">CHAT</button>
  <button class="b" data-k="Q" style="right:100px;bottom:180px;width:76px;height:40px;font-size:9px">CARNET</button>
</div>
<form id="chat"><input id="chatin" maxlength="60" autocomplete="off" placeholder="Ton message..."><button type="submit">OK</button></form>
<button class="btn small" id="mbtn" type="button">MENU</button>
<div id="pause">
  <h2>PAUSE</h2>
  <button class="btn" id="pres" type="button">REPRENDRE</button>
  <button class="btn" id="pque" type="button">CARNET ET CARTE</button>
  <button class="btn" id="psav" type="button">SAUVEGARDES</button>
  <button class="btn" id="pduo" type="button">2 JOUEURS : NON</button>
  <button class="btn" id="pmus" type="button">MUSIQUE : OUI</button>
  <button class="btn" id="pquit" type="button">QUITTER LE JEU</button>
  <p class="help">ÉCHAP : ouvrir ou fermer ce menu<br>Ta partie est sauvegardée quand tu quittes.</p>
</div>
<div id="au">
  <h2>L'OMBRE PARMI NOUS</h2>
  <div id="aubody"></div>
  <button class="btn small" id="auback" type="button">RETOUR</button>
</div>
<div id="saves">
  <h2>SAUVEGARDES</h2>
  <div class="slot"><p id="si1">—</p><div class="row"><button class="btn sv" id="ss1" type="button">SAUVER ICI</button><button class="btn" id="sl1" type="button">CHARGER</button><button class="btn del" id="sd1" type="button">EFFACER</button></div></div>
  <div class="slot"><p id="si2">—</p><div class="row"><button class="btn sv" id="ss2" type="button">SAUVER ICI</button><button class="btn" id="sl2" type="button">CHARGER</button><button class="btn del" id="sd2" type="button">EFFACER</button></div></div>
  <div class="slot"><p id="si3">—</p><div class="row"><button class="btn sv" id="ss3" type="button">SAUVER ICI</button><button class="btn" id="sl3" type="button">CHARGER</button><button class="btn del" id="sd3" type="button">EFFACER</button></div></div>
  <div class="slot fin" id="sfin"><p id="si4">—</p><div class="row"><button class="btn" id="sl4" type="button">CHARGER</button><button class="btn del" id="sd4" type="button">EFFACER</button></div></div>
  <button class="btn" id="sback" type="button">RETOUR</button>
  <p class="help">3 emplacements à toi, et la sauvegarde de fin.</p>
</div>
<div id="menu">
  <canvas id="logo" width="96" height="72"></canvas>
  <h1>THE HOUSE</h1>
  <label for="nm">TON NOM (retiens-le bien)</label>
  <input id="nm" maxlength="10" autocomplete="off" spellcheck="false">
  <button class="btn" id="go" type="button">JOUER</button>
  <button class="btn small" id="newg" type="button" hidden>NOUVELLE PARTIE</button>
  <button class="btn small" id="loadg" type="button">CHARGER UNE SAUVEGARDE</button>
  <button class="btn small" id="mduo" type="button">2 JOUEURS : NON</button>
  <button class="btn small" id="mau" type="button">JOUER EN LIGNE (L'OMBRE PARMI NOUS)</button>
</div>
<script>
'use strict';
const T=16,VW=480,VH=360,CW=12,CHT=8,MAXHP=30;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const FONT='"Press Start 2P",monospace';
const SAVEKEY='leplan-v1';
let S={name:'',f:{},map:'out',x:0,y:0};
let cur=null,curRoom=null;
const P={x:0,y:0,d:0,mv:false,an:0};
let dlg=null,menuOpen=true,chatOpen=false,started=false,story=null,bt=null,lastLine='';
let bannerT=0,bannerTxt='',helpT=20,clock=0;
const bannerQ=[];
const fade={a:0,dir:0,cb:null};
const DV=[[0,1],[-1,0],[1,0],[0,-1]];
const TOUCH=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const rnd=(a,b)=>a+Math.random()*(b-a);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function save(){if(typeof AU!=='undefined'&&AU.on)return;try{if(cur){S.map=cur.id;S.x=P.x;S.y=P.y}localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const j=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(j&&typeof j==='object'&&j.f&&typeof j.f==='object')return j}catch(e){}return null}

/* --- le nom qui s'efface --- */
function lvl(){return 0}
function erode(n,k){const a=Array.from(n),L=a.length,o=a.map((_,i)=>i).sort((p,q)=>Math.abs(p-(L-1)/2)-Math.abs(q-(L-1)/2));for(let i=0;i<Math.min(L-1,k);i++)a[o[i]]='_';return a.join('')}
function nm(){return erode(S.name,Math.ceil(Array.from(S.name).length*lvl()/5))}
const KEYS=[['k1','CLÉ DU VESTIAIRE'],['k2','CLÉ DE GAME 1'],['k3','CLÉ DE GAME 2'],['k4',"CLÉ DE L'ARÈNE"],['k5','CLÉ DU LABYRINTHE']];
function keys(){return KEYS.filter(k=>S.f[k[0]]).length}
const NAMES=[['n_odile','Odile'],['n_leo','Léo'],['n_mad','Madeleine'],['n_love','Rose'],['n_bebert','Bébert'],['n_gerard','Gérard'],['n_suz','Suzanne']];
function names(){return NAMES.filter(n=>S.f[n[0]]).length}

/* ================= SON ================= */
let AC=null,mute=false;
function beep(f,d,type,v,when){if(!AC||mute)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+(when||0);g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={
  blip:p=>beep(p||440,.04),
  pick:()=>{beep(660,.08);beep(880,.12,'square',.04,.08)},
  key:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.16,'square',.05,i*.11)),
  warp:()=>{beep(220,.2,'triangle',.07);beep(330,.25,'triangle',.07,.12)},
  hurt:()=>beep(110,.3,'sawtooth',.06),
  bell:()=>{beep(392,1.4,'sine',.1);beep(784,1,'sine',.04)},
  no:()=>beep(150,.18),
  hit:()=>{beep(880,.05,'square',.05);beep(440,.12,'sawtooth',.05,.04)},
  save:()=>[784,988,1175,1568].forEach((f,i)=>beep(f,.22,'triangle',.06,i*.08)),
  open:()=>{beep(330,.08,'square',.05);beep(494,.08,'square',.05,.07);beep(659,.2,'square',.05,.14)},
  step:()=>beep(90+Math.random()*30,.03,'triangle',.03),
  heal:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.12,'sine',.06,i*.05)),
  shock:()=>{beep(60,.5,'sawtooth',.08);beep(45,.7,'square',.05,.1)},
  appear:()=>[1047,784,659,523,392].forEach((f,i)=>beep(f,.15,'sine',.05,i*.06)),
  heart:()=>{beep(70,.12,'sine',.12);beep(60,.16,'sine',.1,.18)},
  shatter:()=>{for(let i=0;i<8;i++)beep(1200-i*120+Math.random()*80,.06,'square',.04,i*.035)},
  ring:()=>{beep(1319,.08,'square',.04);beep(1319,.08,'square',.04,.12)},
  glitch:()=>{for(let i=0;i<6;i++)beep(100+Math.random()*1800,.03,'sawtooth',.04,i*.03)}
};
/* musique originale : une chanson par zone */
let musicOn=true;try{musicOn=localStorage.getItem('thehouse-music')!=='0'}catch(e){}
let mGain=null,mTimer=null,mStep=0,mNext=0,mMode='title';
const mf=n=>440*Math.pow(2,(n-69)/12);
const CALM={bEv:8,bD:7,bT:'triangle',bV:.09,aT:'triangle',aV:.035,aD:1.6,aP:[0,1,2,1,0,1,2,1],lT:'square',lV:.02,lD:2.6};
const FIGHT={bEv:2,bD:1.6,bT:'sawtooth',bV:.05,aT:'square',aV:.018,aD:1.2,aP:[0,2,1,2,0,2,1,2],lT:'square',lV:.028,lD:2.6};
const SONG=(base,o)=>Object.assign({},base,o);
const SONGS={
 title:SONG(CALM,{sp:.32,lT:'triangle',lV:.06,aT:'sine',aV:.05,bV:.07,aP:[0,1,2,1,2,1,0,1],
  ch:[[48,[60,64,67]],[45,[57,60,64]],[41,[57,60,65]],[43,[55,59,62]],[48,[60,64,67]],[40,[55,59,64]],[41,[57,60,65]],[43,[55,59,62]]],
  mel:[72,0,76,79, 76,0,74,72, 69,72,77,0, 74,0,0,0, 72,0,76,79, 83,0,79,76, 77,76,74,72, 74,0,79,0]}),
 house:SONG(CALM,{sp:.28,
  ch:[[45,[57,60,64]],[41,[57,60,65]],[48,[55,60,64]],[43,[55,59,62]],[45,[57,60,64]],[41,[57,60,65]],[50,[57,62,65]],[40,[56,59,64]]],
  mel:[76,0,72,74, 72,0,69,0, 67,72,76,0, 74,0,71,0, 76,0,81,79, 77,0,72,0, 74,77,76,74, 71,0,0,0]}),
 street:SONG(CALM,{sp:.22,bEv:4,bD:3,aP:[0,2,1,2,0,2,1,2],
  ch:[[41,[57,60,65]],[36,[55,60,64]],[38,[57,62,65]],[34,[58,62,65]],[41,[57,60,65]],[36,[55,60,64]],[34,[58,62,65]],[36,[55,60,64]]],
  mel:[77,0,81,84, 79,0,76,0, 77,81,84,86, 82,0,0,0, 81,79,77,0, 76,79,72,0, 74,77,82,81, 79,0,0,0]}),
 cave:SONG(CALM,{sp:.38,lT:'sine',lV:.06,lD:3.5,aV:.03,aP:[0,0,2,0,1,0,2,0],
  ch:[[33,[57,60,64]],[33,[57,60,64]],[29,[57,60,65]],[29,[57,60,65]],[38,[57,62,65]],[38,[57,62,65]],[40,[56,59,64]],[40,[56,59,64]]],
  mel:[69,0,0,72, 71,0,0,0, 69,0,65,0, 64,0,0,0, 62,0,65,69, 72,0,71,0, 68,0,71,0, 76,0,0,0]}),
 floors:SONG(CALM,{sp:.25,lT:'triangle',lV:.055,aT:'sine',aV:.045,aP:[0,1,2,2,1,0,1,2],
  ch:[[40,[64,67,71]],[36,[64,67,72]],[43,[62,67,71]],[38,[62,66,69]],[40,[64,67,71]],[45,[64,69,72]],[35,[63,66,71]],[35,[63,66,71]]],
  mel:[76,79,83,0, 84,83,79,0, 79,83,86,0, 85,0,81,0, 83,79,76,0, 81,79,76,72, 75,78,81,0, 83,0,0,0]}),
 route:SONG(CALM,{sp:.21,bEv:2,bD:1.8,bV:.08,aP:[0,2,1,2,1,2,0,2],
  ch:[[38,[62,65,69]],[43,[62,67,71]],[38,[62,65,69]],[43,[62,67,71]],[45,[60,64,69]],[43,[62,67,71]],[41,[60,65,69]],[36,[60,64,67]]],
  mel:[74,0,77,79, 81,0,79,77, 74,77,0,74, 71,0,0,0, 76,0,79,81, 83,81,79,0, 77,76,74,72, 74,0,0,0]}),
 field:SONG(CALM,{sp:.34,lT:'sine',lV:.065,lD:3.2,aV:.03,
  ch:[[43,[62,67,70]],[39,[63,67,70]],[46,[62,65,70]],[41,[60,65,69]],[43,[62,67,70]],[39,[63,67,70]],[36,[60,63,67]],[38,[62,66,69]]],
  mel:[79,0,0,82, 79,0,75,0, 77,0,74,0, 72,0,0,0, 79,0,82,86, 84,0,82,0, 79,0,75,0, 78,0,0,0]}),
 boss:SONG(FIGHT,{sp:.15,
  ch:[[38,[62,65,69]],[38,[62,65,69]],[36,[60,64,67]],[41,[60,65,69]],[38,[62,65,69]],[34,[58,62,65]],[36,[60,64,67]],[33,[57,61,64]]],
  mel:[74,77,81,77, 74,0,81,82, 79,76,72,76, 77,0,72,0, 74,77,81,86, 82,0,77,0, 79,76,84,79, 81,0,85,0]}),
 final:SONG(FIGHT,{sp:.115,bV:.06,lV:.032,lT:'sawtooth',
  ch:[[36,[60,63,67]],[36,[60,63,67]],[32,[60,63,68]],[32,[60,63,68]],[41,[60,65,68]],[43,[59,62,67]],[36,[60,63,67]],[43,[59,62,67]]],
  mel:[84,0,87,84, 91,0,87,84, 80,84,87,92, 91,0,87,0, 89,87,84,80, 83,0,86,89, 87,84,79,84, 83,0,79,83]}),
 end:SONG(CALM,{sp:.2,bEv:4,bD:3.5,lT:'triangle',lV:.07,aT:'square',aV:.02,
  ch:[[36,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]],[36,[60,64,67]],[43,[59,62,67]],[41,[60,65,69]],[43,[59,62,67]]],
  mel:[72,76,79,84, 83,0,79,0, 81,0,84,0, 81,77,72,0, 76,79,84,88, 86,0,83,0, 84,81,77,81, 79,0,0,0]})
};
/* variantes : intérieurs des maisons (même air, autre couleur) */
SONGS.inside=SONG(SONGS.street,{sp:.27,tr:-5,lT:'triangle',lV:.05,bEv:8,bD:7});
SONGS.deep=SONG(SONGS.cave,{tr:3,sp:.32,lT:'triangle',lV:.04});
SONGS.floor2=SONG(SONGS.floors,{tr:-2,sp:.29,lT:'square',lV:.022});
SONGS.road2=SONG(SONGS.route,{tr:5,sp:.25,aT:'sine',aV:.04});
SONGS.field2=SONG(SONGS.field,{tr:-3,sp:.3,lT:'triangle'});
SONGS.boss2=SONG(SONGS.boss,{sp:.13,tr:2});
SONGS.boss3=SONG(SONGS.boss,{sp:.12,tr:-3,lT:'sawtooth',lV:.024});
function areaSong(id){id=id||'';
  if(id==='p1'||id==='p2')return 'house';if(id==='hub'||id==='out')return 'street';
  if(id==='puits')return 'cave';if(id==='au')return 'route';if(id==='p3')return 'floors';if(id==='route')return 'route';if(id==='champ')return 'field';
  const n=+(id.match(/^w(\d+)$/)||[])[1];
  if(n){if(n<=9)return 'inside';if(n<=13)return 'deep';if(n<=17)return 'floor2';if(n<=21)return 'road2';return 'field2'}
  return 'house'}
function mNote(f,t,d,type,v){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(mGain);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.05)}catch(e){}}
function mTick(){if(!AC||!mGain)return;const S_=SONGS[mMode]||SONGS.house,SP=S_.sp,tr=S_.tr||0,q=n=>mf(n+tr);if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.4){const bar=(mStep>>3)%8,s=mStep&7,c=S_.ch[bar];

function buildRegions(m){

    while(q.length){const i=q.pop(),x=i%m.w,y=(i/m.w)|0;for(const d of DV){const xx=x+d[0],yy=y+d[1];if(xx<0||yy<0||xx>=m.w||yy>=m.h)continue;const j=yy*m.w+xx;if(m.reg[j]===-1){m.reg[j]=id;q.push(j)}}}
    id++}
  for(const k in m.rooms){const r=m.rooms[k];let g=-1;for(let j=r.y+1;j<r.y+r.h-1&&g<0;j++)for(let i=r.x+1;i<r.x+r.w-1;i++){const v=m.reg[j*m.w+i];if(v>=0){g=v;break}}r.reg=g;if(g>=0)m.regRoom[g]=k}
}

function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function blocked(x,y,w,h,ign){
  const m=cur,x0=Math.floor(x/T),x1=Math.floor((x+w-.01)/T),y0=Math.floor(y/T),y1=Math.floor((y+h-.01)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const tt=tl(m,tx,ty);if(tt===3||tt===2)return true;if(tt===1){const X=tx*T,Y=ty*T;
    if(hit(x,y,w,h,X+7,Y+7,3,3))return true;
    if(tl(m,tx-1,ty)===1&&hit(x,y,w,h,X,Y+7,7,3))return true;
    if(tl(m,tx+1,ty)===1&&hit(x,y,w,h,X+10,Y+7,6,3))return true;
    if(tl(m,tx,ty-1)===1&&hit(x,y,w,h,X+7,Y,3,7))return true;
    if(tl(m,tx,ty+1)===1&&hit(x,y,w,h,X+7,Y+10,3,6))return true}}
  for(const e of m.ents){if(e===ign||!e.solid||e.gone)continue;if(hit(x,y,w,h,e.px+2,e.py+6,12,9))return true}
  return false;
}

function mkBoss(o){
  const nph=o.ph||2;

    ph(b){const f=b.ehp/o.hp;return nph>=3?(f>.66?1:f>.33?2:3):(f>.5?1:2)},
    onHit(b){if(o.shield&&b.f.shield&&!(b.f.open>0)){sfx.no();
      return [`Il se protège : ton coup ne le touche pas. 0 dégât.`,`Va dans PARLER et montre-lui un souvenir de sa maison.`]}return null},
    acts(b){
      const a=[{l:'Observer',f:()=>o.obs}];
      if(o.shield&&b.f.shield&&!(b.f.open>0)){
        const id=o.m,txts=(typeof SV!=='undefined'&&SV[id])||[];
        const av=txts.map((t,i)=>i).filter(i=>S.f[id+'s'+i]&&!(b.f.used||'').includes(','+i+','));
        a.push({l:'Montrer un souvenir',f:b=>{
          if(!av.length)return [`Tu n'as plus de souvenir à montrer. Choisis « Tenir bon ».`];
          const i=av[0];b.f.used=(b.f.used||'')+','+i+',';b.f.open=3;
          return [`Tu lui montres ce que tu as trouvé chez lui :`,txts[i],`Il s'arrête d'un coup. Ses défenses tombent pendant deux tours !`]}});
      }
      const st=b.f.talk|0;

      a.push({l:`S'en aller`,f:b=>{b.fleeNow=1;return [`Tu recules vers la porte.`]}});
      a.push({l:'Tenir bon',f:b=>{b.f.guard=1;
        if(o.shield&&b.f.shield&&!(b.f.open>0)){b.f.open=2;return [`Tu tiens bon sans reculer. Sa défense s'ouvre pendant un tour.`]}
        return [`Tu te protèges : tu prends moitié moins de dégâts ce tour.`]}});

        if(ph===2){if(o.ph2)say.push.apply(say,o.ph2);if(o.shield){b.f.shield=1;b.f.open=0;say.push(`Il se protège : tes coups ne passent plus. Utilise PARLER.`)}}
        if(ph===3&&o.ph3)say.push.apply(say,o.ph3);
        b.ck2=btCk()}
      if(b.f.open>0)b.f.open--;
      if(ph===3&&o.block){b.block=b.turn%2?2:0;say.push(b.block===0?`Il bloque « DESSINER » pour ce tour.`:`Il bloque « OBJET » pour ce tour.`)}
      else b.block=-1;
      const T_=Math.max(0,Math.min(1,(o.hp-40)/200)),TB=o.pt||PT,P=TB[Math.min(ph,TB.length)-1],big=o.hp>=70;
      /* difficulté qui monte : plus le boss est loin dans le jeu, plus ses attaques sont rapides, longues et serrées */
      let pats=P[b.turn%P.length].map(p=>[p[0],+(p[1]*(1+.4*T_)).toFixed(2)]);
      if(T_>=.45&&ph>=2&&!o.pt){const X=[['ring',.6],['walls',.6],['stars',.6],['aimed',.6]];pats=pats.concat([X[(b.turn+o.hp)%X.length]])}
      if(o.last&&ph>=3&&b.ehp<=o.hp*.15&&!b.f.last){b.f.last=1;say.push.apply(say,o.last);pats=TB[TB.length-1].reduce((a,x)=>a.concat(x),[]).slice(0,4);
        return{say,pats,dur:9,w:180,h:125,dmg:(o.dmg||2)}}
      return{say,pats,dur:[4.5,5,5.5][ph-1]+(big?.5:0)+T_*1.2,

  };
}

function PANEL(id,steps,ans,clues){
  M=MAPS[id];const rl=M.rlist.filter(r=>r!=='e'&&r!=='z');
  const proom=rl[rl.length-1],croom=i=>rl[Math.max(0,rl.length-2-i)];
  clues.forEach((c,i)=>{const r=M.rooms[croom(i)];if(r)E('sign',r.x+9,r.y+6,{act:[c]})});
  const pr=M.rooms[proom];
  E('panel',pr.x+3,pr.y+6,{pid:id,act:()=>{
    if(S.f['lB_'+id])return say1(`Le tableau est réglé. Son verrou est ouvert.`);
    let i=0;
    const ask=()=>say([['',steps[i][0],steps[i][1].map((lab,j)=>[lab,()=>{
      if(j!==ans[i]){sfx.no();return say1(`Le tableau claque et se remet à zéro. Tous les réglages sont à refaire.`)}
      i++;sfx.blip(620+i*60);
      if(i<steps.length)return ask();
      S.f['lB_'+id]=1;sfx.key();say([['',`CLIC. CLIC. CLIC.`],['',`Le deuxième verrou de la porte du fond s'ouvre.`]],()=>CHK(id));
    }])]]);
    say([['',`Le tableau électrique de la maison. ${steps.length} disjoncteurs, et des étiquettes effacées.`],
      ['',`${steps.length} réglages. Une erreur, et tout se remet à zéro.`],ask]);
  }});
}
/* --- remplir les pièces restées vides --- */
function FILL(id,kinds,lines){
  const m=MAPS[id];M=m;let i=0;
  for(const rn of m.rlist){
    if(rn==='e'||rn==='z')continue;
    const r=m.rooms[rn];
    const used=m.ents.some(e=>e.act&&e.x>r.x&&e.x<r.x+r.w-1&&e.y>r.y&&e.y<r.y+r.h-1);
    if(used)continue;
    put(kinds[i%kinds.length],rn,6,4,[lines[i%lines.length]]);i++;
  }
}

/* --- éviter que deux objets se retrouvent sur la même case --- */
(function DECLUTTER(){
  const dirs=[[2,0],[-2,0],[0,2],[0,-2],[3,2],[-3,-2],[2,-3],[-2,3],[4,0],[-4,0],[0,3],[0,-3]];
  for(const id in MAPS){const m=MAPS[id];
    for(const e of m.ents){
      if(!(e.k==='relic'||e.k==='piece'||e.k==='note')||typeof e.i!=='number')continue;
      const clash=()=>m.ents.some(o=>o!==e&&(o.act||o.touch)&&o.k!=='hazard'&&Math.abs(o.x-e.x)<=1&&Math.abs(o.y-e.y)<=1);
      let t=0;
      while(clash()&&t<dirs.length){const d=dirs[t++],nx=e.x+d[0],ny=e.y+d[1];
        if(nx>0&&ny>0&&nx<m.w&&ny<m.h&&m.t[ny*m.w+nx]===0){e.x=nx;e.y=ny;e.px=nx*T;e.py=ny*T;e.hx=e.px;e.hy=e.py}}
    }}
})();

/* --- éviter les superpositions dans les nouveaux sous-sols --- */
(function(){
  const dirs=[[2,0],[-2,0],[0,2],[0,-2],[3,2],[-3,-2],[2,-3],[-2,3],[4,0],[-4,0],[0,3],[0,-3]];
  for(const id of ['w10','w11','w12','w13','puits']){const m=MAPS[id];
    for(const e of m.ents){
      if(!(e.k==='relic'||e.k==='note')||typeof e.i!=='number')continue;
      const clash=()=>m.ents.some(o=>o!==e&&(o.act||o.touch)&&Math.abs(o.x-e.x)<=1&&Math.abs(o.y-e.y)<=1);
      let t=0;
      while(clash()&&t<dirs.length){const d=dirs[t++],nx=e.x+d[0],ny=e.y+d[1];
        if(nx>0&&ny>0&&nx<m.w&&ny<m.h&&m.t[ny*m.w+nx]===0){e.x=nx;e.y=ny;e.px=nx*T;e.py=ny*T;e.hx=e.px;e.hy=e.py}}
    }}
})();

/* --- éviter les superpositions --- */
(function(){
  const dirs=[[2,0],[-2,0],[0,2],[0,-2],[3,2],[-3,-2],[2,-3],[-2,3],[4,0],[-4,0],[0,3],[0,-3]];
  for(const id of ['w14','w15','w16','w17','p3']){const m=MAPS[id];
    for(const e of m.ents){
      if(e.k!=='relic'||typeof e.i!=='number')continue;
      const clash=()=>m.ents.some(o=>o!==e&&(o.act||o.touch)&&Math.abs(o.x-e.x)<=1&&Math.abs(o.y-e.y)<=1);
      let t=0;
      while(clash()&&t<dirs.length){const d=dirs[t++],nx=e.x+d[0],ny=e.y+d[1];
        if(nx>0&&ny>0&&nx<m.w&&ny<m.h&&m.t[ny*m.w+nx]===0){e.x=nx;e.y=ny;e.px=nx*T;e.py=ny*T;e.hx=e.px;e.hy=e.py}}
    }}
})();

      const ok=rooms.filter((_,i)=>g(i)===target[i]).length;if(ok===rooms.length)return OPEN(id,txt);

  /* volets : chacun bascule lui-même et ses deux voisins (en cercle) */
  lights(id,rooms,start,txt){const m=MAPS[id],key='lo_'+id,st=()=>S.f[key]||start;
    rooms.forEach((rn,i)=>E('shutter',m.rooms[rn].x+2,m.rooms[rn].y+2,{on:()=>st()[i]==='1'||!!S.f['lC_'+id],act:()=>{
      if(S.f['lC_'+id])return say1(`Le volet est ouvert. Le matin entre.`);
      const s=st().split(''),n=rooms.length,L3=[(i+n-1)%n,i,(i+1)%n];L3.forEach(k=>s[k]=s[k]==='1'?'0':'1');S.f[key]=s.join('');sfx.blip(500+i*50);save();
      if(!S.f[key].includes('0'))return OPEN(id,txt);
      say1(`Tu pousses le volet n° ${i+1}. Les volets ${L3.map(k=>k+1).join(', ')} basculent.`,`Volets : ${S.f[key].split('').map(x=>x==='1'?'■':'□').join(' ')} (■ = ouvert)`)}}));
  },
  /* objets à porter un par un jusqu'au bon destinataire */
  deliver(id,objs,dests,oProp,dProp,txt){const m=MAPS[id],hk='dh_'+id;

    dests.forEach((q,i)=>E(dProp,m.rooms[q[0]].x+2,m.rooms[q[0]].y+6,{i,act:()=>{
      if(S.f['dd_'+id+i])return say1(q[1],`C'est déjà livré.`);

  },
  /* allumer tout avant la fin du temps */
  timed(id,rooms,secs,prop,txt){const m=MAPS[id],k='tm_'+id;let t0=0;const n=()=>rooms.filter((_,i)=>S.f[k+i]).length;
    rooms.forEach((rn,i)=>E(prop,m.rooms[rn].x+2,m.rooms[rn].y+2,{on:()=>!!(S.f['lC_'+id]||S.f[k+i]),act:()=>{

      if(S.f[k+i])return say1(`Celle-ci brûle encore. Il te reste ${Math.max(0,secs-(el|0))} secondes.`);
      if(!n())t0=performance.now();S.f[k+i]=1;sfx.blip(420+n()*80);

  },

(function(){

    if(n<4)return D('La Borne',`Je suis la borne zéro. Je compte les kilomètres depuis le début.`,`La Route construit une maison pour chaque personne perdue. Plus on se perd, plus elle construit.`,`Allume les quatre fenêtres. Après, il faudra parler à la Route, au carrefour. (${n}/4)`);
    D('La Borne',`Les quatre sont sortis. Le carrefour est ouvert !`,`La Route a peur d'une seule chose : avoir une fin. Elle croit qu'après, plus personne ne marchera sur elle.`)});
  put('sign','abri',2,2,[`Un abribus. L'horaire dit : « prochain passage : jamais. Marchez. »`]);
  link('route','carrefour',{lock:'dRoute',act:()=>{
    if(gFreed('route')>=4){S.f.dRoute=1;sfx.key();save();return say1(`Les quatre fenêtres brillent. Le carrefour s'ouvre.`)}
    sfx.no();say1(`Une barrière : « ROUTE BARRÉE ».`,`Il reste ${4-gFreed('route')} fenêtre${4-gFreed('route')>1?'s':''} à allumer.`)}});
  const ROUTE=mkBoss({n:'LA ROUTE',m:'route',hp:170,ph:3,shield:1,block:1,dmg:3,draw:BD.route,

    obs:[`Elle perd les gens exprès pour qu'ils continuent de marcher. Elle a peur qu'on arrive.`,`Les cadeaux des habitants la font hésiter.`],

      [`Dire : « Une route, ça sert à arriver »`,[`La Route se recouche doucement. Tout au bout, un champ apparaît.`]]],
    win:[`La Route se casse en morceaux de goudron.`],spare:[`La Route se recouche. Elle accepte d'avoir une fin.`]});

      say([['La Route',`Bon... Vas-y. Mais repasse par moi.`],['',`Au bout du carrefour, la route s'arrête. Il y a un champ.`]])}))});
  E('ring',M.rooms.carrefour.x+20,M.rooms.carrefour.y+6,{solid:false,hid:()=>!S.f.free25,act:()=>say([['',`Le bout de la route. Un champ, sous un ciel qui hésite entre la nuit et le matin.`,[[`Aller au bout de la route`,()=>toP5()],['Pas encore',null]]]])});
})();

/* --- éviter les superpositions --- */
(function(){
  const dirs=[[2,0],[-2,0],[0,2],[0,-2],[3,2],[-3,-2],[2,-3],[-2,3],[4,0],[-4,0],[0,3],[0,-3]];
  for(const id of ['w18','w19','w20','w21','w22','w23','w24','w25']){const m=MAPS[id];
    for(const e of m.ents){if(e.k!=='relic'||typeof e.i!=='number')continue;
      const clash=()=>m.ents.some(o=>o!==e&&(o.act||o.touch)&&Math.abs(o.x-e.x)<=1&&Math.abs(o.y-e.y)<=1);
      let t=0;while(clash()&&t<dirs.length){const d=dirs[t++],nx=e.x+d[0],ny=e.y+d[1];
        if(nx>0&&ny>0&&nx<m.w&&ny<m.h&&m.t[ny*m.w+nx]===0){e.x=nx;e.y=ny;e.px=nx*T;e.py=ny*T;e.hx=e.px;e.hy=e.py}}}}
})();

  $('menu').style.display='none';menuOpen=false;started=true;helpT=20;$('mbtn').style.display='block';
  if(sv&&sv.f&&sv.f.reveil){S.f=sv.f;recolor();S.name=clean(sv.name,10)||S.name;setMap(MAPS[sv.map]?sv.map:'p1');P.x=+sv.x||0;P.y=+sv.y||0;
    if(blocked(P.x,P.y,10,8)){const r=cur.rooms[Object.keys(cur.rooms)[0]];P.x=(r.x+3)*T;P.y=(r.y+3)*T}
    save();pushPresence(true);banner('Bon retour, '+nm());return}
  S.f={};recolor();setMap('p1');const r0=MAPS.p1.rooms.chapelle;P.x=(r0.x+6)*T+3;P.y=(r0.y+5)*T+6;P.d=0;save();pushPresence(true);
  playStory(INTRO,()=>{save()});
}
$('go').addEventListener('click',()=>startGame(false));
$('mau').addEventListener('click',()=>{$('menu').style.display='none';auShow()});
$('auback').addEventListener('click',auBack);
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(!started&&!mTimer)titleMusic()}));
$('newg').addEventListener('click',()=>startGame(true));
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')startGame(false);e.stopPropagation()});
(function logo(){const g=$('logo').getContext('2d');
  drawHouse(g,14,26,5,{dark:1});
  for(let i=0;i<5;i++)R(g,70+((i%2)?1:0),20-i*4,3,3,'#777');
  for(let i=0;i<22;i++)R(g,16+i*3,64,2,1,'#444');
  R(g,44,60,10,4,'#111');R(g,45,61,8,3,'#000');
})();

/* ================= DÉMARRAGE ================= */
function bakeAll(){for(const k in MAPS){bake(MAPS[k]);if(!MAPS[k].reg)buildRegions(MAPS[k])}}
(function init(){
  const sv=loadSave();if(sv){$('nm').value=clean(sv.name,10);if(sv.f&&sv.f.reveil){$('newg').hidden=false;$('go').textContent='CONTINUER'}}
  bakeAll();setMap('p1');
  try{if(document.fonts&&document.fonts.load)document.fonts.load('16px "Press Start 2P"').then(()=>{for(const k in MAPS)bake(MAPS[k])}).catch(()=>{})}catch(e){}
  initRoom();requestAnimationFrame(frame);
  setInterval(()=>{if(started&&!menuOpen)save()},15000);
})();

/* ================= SAUVEGARDES (3 emplacements) ================= */
const SLOTK=i=>typeof i==='string'?'thehouse-auto-'+i:i===4?'thehouse-slotfin':'thehouse-slot'+i;
/* nettoyage : les sauvegardes automatiques et la sauvegarde cadeau ont été enlevées */
try{for(const k of Object.keys(localStorage))if(k.startsWith('thehouse-auto-')||k==='thehouse-preset-final')localStorage.removeItem(k)}catch(e){}
let savesOpen=false,savesFrom='pause';
function slotData(i){try{const j=JSON.parse(localStorage.getItem(SLOTK(i))||'null');if(j&&typeof j==='object'&&j.f&&typeof j.f==='object')return j}catch(e){}return null}
function chapName(f){return f.bonusWin?'BONUS terminé':f.bonus?'BONUS — La ville en couleurs':f.fin?'FIN — Le monde en couleurs':f.p5?'P5 — Le bout de la route':f.p4?'P4 — La route des maisons':f.p3?'P3 — La maison de la route':f.end?'Sous la rue (le puits)':f.hub?'La rue':f.p2?'P2 — Le sous-sol':'P1 — La chapelle'}
function cnt(f,a,b){let n=0;for(let i=a;i<=b;i++)if(f['free'+i])n++;return n}
function slotInfo(j){
  if(!j)return 'EMPLACEMENT VIDE';
  const f=j.f,d=new Date(j.t||0),two=x=>String(x).padStart(2,'0');
  const k=['k1','k2','k3','k4','k5'].filter(x=>f[x]).length;
  const date=j.t?`${two(d.getDate())}/${two(d.getMonth()+1)} à ${two(d.getHours())}h${two(d.getMinutes())}`:'';
  return `${clean(j.name,10)||'SANS NOM'} — ${chapName(f)}<br>Clés ${k}/5 · Maisons ${cnt(f,2,9)}/8 · Sous-sols ${cnt(f,11,14)}/4 · Étages ${cnt(f,16,19)}/4${f.p4?` · Route ${cnt(f,21,24)}/4`:''}${f.p5?` · Champ ${cnt(f,26,29)}/4`:''}<br>${date}`;
}
let armed=null,armedT=0;
function arm(id,txt){const b=$(id);if(armed===id&&Date.now()-armedT<4000){armed=null;return true}
  disarm();armed=id;armedT=Date.now();b.dataset.t=b.textContent;b.textContent=txt;b.classList.add('warn');sfx.no();return false}
function disarm(){if(armed){const b=$(armed);if(b&&b.dataset.t){b.textContent=b.dataset.t;b.classList.remove('warn')}}armed=null}
function refreshSlots(){disarm();
  for(let i=1;i<=4;i++){const j=slotData(i);$('si'+i).innerHTML=i===4?(j?'★ SAUVEGARDE DE FIN ★<br>'+slotInfo(j):'★ SAUVEGARDE DE FIN ★<br>Elle apparaît quand tu finis le jeu.'):slotInfo(j);
    if(i<4)$('ss'+i).hidden=!(savesFrom==='pause'&&started);$('sl'+i).hidden=!j;$('sd'+i).hidden=!j}
}
function delSlot(i){if(!slotData(i))return;if(!arm('sd'+i,'SÛR ? (ENCORE)'))return;
  try{localStorage.removeItem(SLOTK(i))}catch(e){}sfx.hurt();refreshSlots();if(typeof i==='number')$('si'+i).innerHTML='✖ EFFACÉ<br>'+(i===4?'':'EMPLACEMENT VIDE');else banner('SAUVEGARDE EFFACÉE');
  const b=[...$('saves').querySelectorAll('.btn')].filter(x=>!x.hidden);if(b.length)b[0].focus()}
function endSave(){try{localStorage.setItem(SLOTK(4),JSON.stringify(Object.assign({},S,{t:Date.now()})))}catch(e){}}
function openSaves(from){savesFrom=from;savesOpen=true;refreshSlots();$('saves').style.display='flex';
  const b=[...$('saves').querySelectorAll('.btn')].filter(x=>!x.hidden);if(b.length)b[0].focus()}
function closeSaves(){savesOpen=false;$('saves').style.display='none';const f=savesFrom==='pause'?$('psav'):$('loadg');if(f&&f.offsetParent!==null)f.focus()}
function saveSlot(i){
  if(!started)return;if(slotData(i)&&!arm('ss'+i,'REMPLACER ? (ENCORE)'))return;save();
  try{localStorage.setItem(SLOTK(i),JSON.stringify(Object.assign({},S,{t:Date.now()})))}catch(e){}
  sfx.save();refreshSlots();$('si'+i).innerHTML='✔ SAUVEGARDÉ<br>'+slotInfo(slotData(i));
}
function loadSlot(i){
  const j=slotData(i);if(!j)return;disarm();
  try{localStorage.setItem(SAVEKEY,JSON.stringify(j))}catch(e){}
  closeSaves();
  if(savesFrom==='pause'&&started){closePause();
    S.f=JSON.parse(JSON.stringify(j.f));recolor();S.name=clean(j.name,10)||S.name;dlg=null;journal=0;story=null;bt=null;
    fadeTo(()=>{setMap(MAPS[j.map]?j.map:'p1');P.x=+j.x||0;P.y=+j.y||0;
      if(blocked(P.x,P.y,10,8)){const r=cur.rooms[Object.keys(cur.rooms)[0]];P.x=(r.x+3)*T;P.y=(r.y+3)*T}
      DUO.map=null;save();banner(typeof i==='number'?'PARTIE CHARGÉE (emplacement '+i+')':'PARTIE CHARGÉE')});
    return}
  $('nm').value=clean(j.name,10);startGame(false);
}
for(let i=1;i<=4;i++){if(i<4)$('ss'+i).addEventListener('click',()=>saveSlot(i));$('sl'+i).addEventListener('click',()=>loadSlot(i));$('sd'+i).addEventListener('click',()=>delSlot(i))}
$('sback').addEventListener('click',closeSaves);
$('psav').addEventListener('click',()=>openSaves('pause'));
$('loadg').addEventListener('click',()=>openSaves('title'));

/* ================= 2 JOUEURS SUR LE MÊME ÉCRAN ================= */
const DUO={on:false,map:null};try{DUO.on=localStorage.getItem('thehouse-duo')==='1'}catch(e){}
const K2={};
const P2={x:0,y:0,d:0,mv:false,an:0};
const HERO2={skin:'#c99a74',hair:'#2b2b2b',top:'#6b8f5a',legs:'#3d4a36'};
const CODE2={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',ShiftRight:'run'};
function duoLabel(){for(const id of ['pduo','mduo'])$(id).textContent='2 JOUEURS : '+(DUO.on?'OUI':'NON')}
function setDuo(on){
  DUO.on=on;DUO.map=null;try{localStorage.setItem('thehouse-duo',on?'1':'0')}catch(e){}
  for(const k in K2)K2[k]=false;duoLabel();
  if(started){sfx.blip(on?820:300);banner(on?'JOUEUR 2 A REJOINT LA PARTIE':'Joueur 2 a quitté la partie');
    if(on)banner('J1 : WASD + E · J2 : FLÈCHES + ENTRÉE')}
}
$('pduo').addEventListener('click',()=>setDuo(!DUO.on));
$('mduo').addEventListener('click',()=>setDuo(!DUO.on));
duoLabel();
function p2Reg(x,y){const m=cur;if(!m||!m.reg)return -1;const tx=Math.floor((x+5)/T),ty=Math.floor((y+4)/T);
  if(tx<0||ty<0||tx>=m.w||ty>=m.h)return -1;return m.reg[ty*m.w+tx]}
function p2Ok(x,y){if(blocked(x,y,10,8))return false;const r=p2Reg(x,y);return r>=0&&visSet.has(r)}
function placeP2(){
  for(const o of [[14,0],[-14,0],[0,12],[0,-12],[20,8],[-20,8],[20,-8],[-20,-8]]){const x=P.x+o[0],y=P.y+o[1];if(p2Ok(x,y)){P2.x=x;P2.y=y;P2.d=P.d;return}}
  P2.x=P.x;P2.y=P.y;P2.d=P.d;
}
/* le joueur 2 reste dans la pièce affichée : si le joueur 1 change de pièce, il le rejoint */
function duoUpdate(dt,free){
  if(!DUO.on||!cur||!visSet.size)return;
  if(DUO.map!==cur.id||!visSet.has(p2Reg(P2.x,P2.y))){DUO.map=cur.id;placeP2()}
  if(!free){P2.mv=false;return}
  let dx=(K2.right?1:0)-(K2.left?1:0);const dy=(K2.down?1:0)-(K2.up?1:0);
  if(dx||dy){const ro=roomObj();if(ro&&ro.mirror)dx=-dx;
    if(dy>0)P2.d=0;else if(dy<0)P2.d=3;if(dx<0)P2.d=1;else if(dx>0)P2.d=2;
    const sp=(K2.run?118:76)*dt*(dx&&dy?.7071:1);
    if(dx&&p2Ok(P2.x+dx*sp,P2.y))P2.x+=dx*sp;
    if(dy&&p2Ok(P2.x,P2.y+dy*sp))P2.y+=dy*sp;
    P2.mv=true;P2.an+=dt*(K2.run?13:8)}else{P2.mv=false;P2.an=0}
  for(const e of cur.ents){if(e.gone||!e.touch||e.plate)continue;if(hit(P2.x,P2.y,10,8,e.px+3,e.py+4,10,10)){e.touch(e);break}}
}
function target2(){const cx=P2.x+5+DV[P2.d][0]*11,cy=P2.y+4+DV[P2.d][1]*11;let best=null,bd=17;
  for(const e of cur.ents){if(e.gone||!e.act||!e.va)continue;const d=Math.hypot(e.px+8-cx,e.py+10-cy);if(d<bd){bd=d;best=e}}return best}
function pressA2(){
  if(story||bt||journal||dlg||fade.dir){pressA();return}
  if(!started||!DUO.on)return;
  const e=target2();if(!e)return;
  if(e.k==='npc'&&!e.wander){const dx=P2.x+5-(e.px+8),dy=P2.y+4-(e.py+10);e.d=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0)}
  if(typeof e.act==='function')e.act(e);else if(Array.isArray(e.act))say(e.act.map(t=>[e.name||'',t]));
}
function nav2(k){if(dlg||story||journal||(bt&&bt.st!=='dodge')){if(k==='up'){selMove(-1);btNav('up')}if(k==='down'){selMove(1);btNav('down')}if(k==='left')btNav('left');if(k==='right')btNav('right')}}
function drawP2(){
  drawChar(ctx,Math.round(P2.x)-3,Math.round(P2.y)-12,HERO2,P2.d,P2.mv?1+(P2.an|0)%2:0);
  ctx.font='8px '+FONT;ctx.textBaseline='top';ctx.fillStyle='#7fe87f';ctx.fillText('2',Math.round(P2.x)+2,Math.round(P2.y)-24);
}
/* en combat : le joueur 2 dirige un bouclier vert qui détruit les balles */
function btDuoMove(b,dt){if(!DUO.on)return;
  if(b.s2x===undefined){b.s2x=-30;b.s2y=b.h/4}
  const sp=125*dt,dx=(K2.right?1:0)-(K2.left?1:0),dy=(K2.down?1:0)-(K2.up?1:0),n=dx&&dy?.7071:1;
  b.s2x=cl(b.s2x+dx*sp*n,-b.w/2+6,b.w/2-6);b.s2y=cl(b.s2y+dy*sp*n,-b.h/2+6,b.h/2-6)}
function btDuoBlock(b,u){return DUO.on&&b.s2x!==undefined&&Math.hypot(u.x-b.s2x,u.y-b.s2y)<u.r+7}
function btDuoDraw(c,b){if(!DUO.on||b.s2x===undefined)return;const X=Math.round(320+b.s2x),Y=Math.round(300+b.s2y);
  c.strokeStyle='#7fe87f';c.lineWidth=2;c.strokeRect(X-6,Y-6,12,12);R(c,X-2,Y-2,4,4,'#7fe87f');
  c.font='8px '+FONT;c.fillStyle='#7fe87f';c.textAlign='center';c.fillText('J2 : BOUCLIER (bloque les balles)',320,300-b.h/2-16);c.textAlign='left'}
/* 2e manette = joueur 2 */
let pad2Prev=[],pad2Ax={};
function pollPad2(g){
  if(!g){if(pad2Ax.used){for(const k of ['up','down','left','right','run'])K2[k]=false;pad2Ax={}}pad2Prev=[];return}
  const ax=g.axes||[],bs=g.buttons||[],dn=i=>!!(bs[i]&&(bs[i].pressed||bs[i].value>.5)),dz=.45;
  const edge=i=>{const now=dn(i),r=now&&!pad2Prev[i];pad2Prev[i]=now;return r};
  const a=edge(0),st=edge(9);
  if(!DUO.on){if((a||st)&&started&&!menuOpen)setDuo(true);return}
  pad2Ax.used=1;
  const set=(k,on)=>{if(on&&!K2[k])nav2(k);K2[k]=on};
  if(!menuOpen){set('left',dn(14)||(ax[0]||0)<-dz);set('right',dn(15)||(ax[0]||0)>dz);set('up',dn(12)||(ax[1]||0)<-dz);set('down',dn(13)||(ax[1]||0)>dz)}
  K2.run=dn(1)||dn(4)||dn(5)||dn(6)||dn(7);
  if(a&&!menuOpen)pressA2();
  if(st&&!bt&&!story){if(pauseOpen)closePause();else if(!menuOpen)openPause()}
}
</script>
